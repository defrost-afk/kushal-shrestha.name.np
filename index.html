<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1f2937, #0b1220 70%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .wrap {
      width: 100%;
      max-width: 760px;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 8px;
    }
    .sub {
      color: var(--muted);
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }
    .card p {
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Games</h1>
    <p class="sub">Choose a game to play.</p>
    <section class="grid">
      <a class="card" href="./imposter/index.html">
        <h2>Imposter</h2>
        <p>Play Chhal (Imposter Game).</p>
      </a>
      <a class="card" href="./headsup/index.html">
        <h2>Heads Up</h2>
        <p>Heads Up section ready for your game.</p>
      </a>
    </section>
  </main>
</body>
</html>
